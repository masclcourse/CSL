<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account | MA CSL Prep</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f1b2d;--navy2:#16273f;--orange:#ff8a1f;--cream:#f7f3ea;--ink:#1c2535;--mut:#5d6779;--ok:#1f8a4c;--bad:#c2372b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5}
h1,h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}
.top{background:var(--navy);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{color:var(--orange);font:700 20px 'Barlow Condensed';letter-spacing:.04em;margin-right:auto}
.top a,.top button{font:700 14px Inter;padding:7px 14px;border-radius:20px;border:2px solid var(--orange);color:var(--orange);text-decoration:none;background:none;cursor:pointer}
.top a.on{background:var(--orange);color:#111}
.wrap{max-width:560px;margin:0 auto;padding:36px 18px}
.card{background:#fff;border:1px solid #e5dfd0;border-radius:12px;padding:22px;margin-bottom:18px}
h1{font-size:40px;color:var(--navy);margin-bottom:14px}h2{font-size:26px;color:var(--navy);margin-bottom:10px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid #cfc8b6;border-radius:8px;font:16px Inter}
.btn{display:inline-block;background:var(--orange);color:#111;font:600 16px Inter;padding:12px 20px;border:0;border-radius:8px;cursor:pointer;margin-top:16px}
.btn.alt{background:none;border:2px solid var(--navy);color:var(--navy)}
.btn[disabled]{opacity:.5;cursor:wait}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border:0;border-bottom:3px solid #e5dfd0;background:none;font:600 15px Inter;cursor:pointer;color:var(--mut)}.tabs button.on{border-color:var(--orange);color:var(--ink)}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}.msg.ok{background:#dff3e6;color:#14522d}.msg.err{background:#f9e0dd;color:#7d1f17}.msg.info{background:#fff3e2}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee7d6}.row:last-child{border:0}
.row small{color:var(--mut);display:block}
.row .btn{margin:0;padding:9px 14px;font-size:14px;white-space:nowrap}
.own{color:var(--ok);font-weight:600;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="top"><b>CSL PREP</b>
<a id="lEn" href="#" data-l="en">🇺🇸 English</a><a id="lPt" href="#" data-l="pt">🇧🇷 Português</a>
<a id="back" href="index.html"></a><button id="out" class="hide"></button></div>
<div class="wrap">
<div id="msg"></div>

<div id="auth" class="card hide">
 <h1 id="tTitle"></h1>
 <div class="tabs"><button id="tabIn" class="on"></button><button id="tabUp"></button></div>
 <form id="f">
  <label id="lEmail"></label><input id="email" type="email" autocomplete="email" required>
  <label id="lPass"></label><input id="pass" type="password" autocomplete="current-password" minlength="8" required>
  <button class="btn" id="go" type="submit"></button>
 </form>
 <p><a href="#" id="forgot"></a></p>
</div>

<div id="acct" class="hide">
 <h1 id="aTitle"></h1>
 <div class="card"><h2 id="hMine"></h2><div id="mine"></div></div>
 <div class="card"><h2 id="hBuy"></h2><div id="shop"></div></div>
</div>
</div>

<script>
const SUPABASE_URL='https://kzhfqdvptcbgpxtfxjmz.supabase.co';
const SUPABASE_KEY='sb_publishable_DoTwW05Xjutay5tFS4KkKA_bu0FFlGS'; // publishable key: safe in the browser
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const T={
 en:{back:'Back to site',out:'Log out',login:'Log in',signup:'Create account',tTitle:'Your account',email:'Email',pass:'Password (8+ characters)',forgot:'Forgot password?',
  aTitle:'My account',hMine:'My purchases',hBuy:'Buy',none:'No purchases yet.',own:'Purchased ✓',buy:'Buy',
  course:'Online course',courseD:'500 guided questions, online access',pack100:'100 questions',pack180:'180 questions',pack250:'250 questions',
  checkEmail:'Account created. Check your email and click the confirmation link, then log in.',paid:'Payment received. Your purchase will appear below in a few seconds.',
  canceled:'Payment canceled. You were not charged.',resetSent:'If that email has an account, a reset link was sent.',needEmail:'Type your email first.',
  wait:'Please wait…',bad:'Something went wrong. Please try again.',loginFirst:'Log in or create an account to continue your purchase.',
  content:'Your questions will be available here as soon as they are published.'},
 pt:{back:'Voltar ao site',out:'Sair',login:'Entrar',signup:'Criar conta',tTitle:'Sua conta',email:'E-mail',pass:'Senha (mín. 8 caracteres)',forgot:'Esqueceu a senha?',
  aTitle:'Minha conta',hMine:'Minhas compras',hBuy:'Comprar',none:'Nenhuma compra ainda.',own:'Comprado ✓',buy:'Comprar',
  course:'Curso online',courseD:'500 questões guiadas, acesso online',pack100:'100 questões',pack180:'180 questões',pack250:'250 questões',
  checkEmail:'Conta criada. Verifique seu e-mail, clique no link de confirmação e depois entre.',paid:'Pagamento recebido. Sua compra aparecerá abaixo em alguns segundos.',
  canceled:'Pagamento cancelado. Você não foi cobrado.',resetSent:'Se esse e-mail tiver conta, enviamos um link de redefinição.',needEmail:'Digite seu e-mail primeiro.',
  wait:'Aguarde…',bad:'Algo deu errado. Tente novamente.',loginFirst:'Entre ou crie uma conta para continuar sua compra.',
  content:'Suas questões ficarão disponíveis aqui assim que forem publicadas.'}
};
const PRODUCTS=[['course','$150','courseD'],['pack100','$49.99'],['pack180','$79.99'],['pack250','$99.99']];
const q=new URLSearchParams(location.search);
let lang=q.get('lang')||localStorage.getItem('lang')||'en'; if(!T[lang])lang='en';
let mode='in', user=null;
const $=id=>document.getElementById(id), t=k=>T[lang][k];
const say=(k,cls,raw)=>{$('msg').innerHTML=k?'<div class="msg '+cls+'">'+(raw||t(k))+'</div>':''};

function applyLang(){
 try{localStorage.setItem('lang',lang)}catch(e){}
 document.documentElement.lang=lang==='pt'?'pt-BR':'en';
 $('lEn').classList.toggle('on',lang==='en');$('lPt').classList.toggle('on',lang==='pt');
 $('back').textContent=t('back');$('back').href=lang==='pt'?'pt.html':'index.html';
 $('out').textContent=t('out');$('tTitle').textContent=t('tTitle');$('tabIn').textContent=t('login');$('tabUp').textContent=t('signup');
 $('lEmail').textContent=t('email');$('lPass').textContent=t('pass');$('forgot').textContent=t('forgot');
 $('aTitle').textContent=t('aTitle');$('hMine').textContent=t('hMine');$('hBuy').textContent=t('hBuy');
 $('go').textContent=mode==='in'?t('login'):t('signup');
 if(user)render();
}
document.querySelectorAll('[data-l]').forEach(a=>a.onclick=e=>{e.preventDefault();lang=a.dataset.l;applyLang()});
$('tabIn').onclick=()=>{mode='in';$('tabIn').classList.add('on');$('tabUp').classList.remove('on');applyLang()};
$('tabUp').onclick=()=>{mode='up';$('tabUp').classList.add('on');$('tabIn').classList.remove('on');applyLang()};

$('f').onsubmit=async e=>{
 e.preventDefault();const email=$('email').value.trim(),password=$('pass').value;$('go').disabled=true;
 try{
  if(mode==='up'){
   const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname+'?lang='+lang}});
   if(error)throw error;say('checkEmail','ok');
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;say('');
  }
 }catch(err){say(null,'err',String(err.message||t('bad')))}
 $('go').disabled=false;
};
$('forgot').onclick=async e=>{e.preventDefault();const email=$('email').value.trim();if(!email)return say('needEmail','info');
 await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?lang='+lang});say('resetSent','ok')};
$('out').onclick=async()=>{await sb.auth.signOut()};

async function buy(product){
 const btns=document.querySelectorAll('.buybtn');btns.forEach(b=>b.disabled=true);say('wait','info');
 try{
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(SUPABASE_URL+'/functions/v1/create-checkout',{method:'POST',
   headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},
   body:JSON.stringify({product,lang})});
  const d=await r.json();if(!d.url)throw new Error(d.error||t('bad'));
  location.href=d.url;
 }catch(err){say(null,'err',String(err.message||t('bad')));btns.forEach(b=>b.disabled=false)}
}

let owned=[],autoBuyDone=false;
async function loadPurchases(){
 const {data}=await sb.from('purchases').select('product,created_at').order('created_at',{ascending:false});
 owned=(data||[]).map(r=>r.product);
}
function render(){
 $('mine').innerHTML=(owned.length?'<a class="btn" style="display:inline-block;margin:0 0 12px;text-decoration:none" href="quiz.html?lang='+lang+'">'+(lang==='pt'?'Começar a praticar':'Start practice')+'</a>':'')+(owned.length?owned.map(p=>'<div class="row"><div><b>'+t(p)+'</b><small>'+t('content')+'</small></div><span class="own">'+t('own')+'</span></div>').join(''):'<p>'+t('none')+'</p>');
 $('shop').innerHTML=PRODUCTS.map(([id,price,d])=>{
  const has=owned.includes(id)||(id!=='course'&&owned.includes('course'));
  return '<div class="row"><div><b>'+t(id)+'</b><small>'+(d?t(d):'')+'</small></div>'+(has?'<span class="own">'+t('own')+'</span>':'<button class="btn buybtn" data-p="'+id+'">'+t('buy')+' '+price+'</button>')+'</div>';
 }).join('');
 document.querySelectorAll('.buybtn').forEach(b=>b.onclick=()=>buy(b.dataset.p));
}

async function onAuth(session){
 user=session&&session.user||null;
 $('auth').classList.toggle('hide',!!user);$('acct').classList.toggle('hide',!user);$('out').classList.toggle('hide',!user);
 if(!user){const want=q.get('buy');if(want)say('loginFirst','info');return}
 await loadPurchases();render();
 const want=q.get('buy');
 if(want&&!autoBuyDone&&PRODUCTS.some(p=>p[0]===want)&&!owned.includes(want)){autoBuyDone=true;history.replaceState(null,'',location.pathname+'?lang='+lang);buy(want)}
 if(q.get('paid')){say('paid','ok');setTimeout(async()=>{await loadPurchases();render()},4000);setTimeout(async()=>{await loadPurchases();render()},10000)}
 if(q.get('canceled'))say('canceled','info');
}
sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>onAuth(session),0)});
applyLang();
sb.auth.getSession().then(({data})=>onAuth(data.session));
</script>
</body>
</html>
